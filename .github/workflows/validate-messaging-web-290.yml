name: Validate Messaging Web 2.9.0
on:
  push:
    branches: [ chatgpt-messaging-2.9.0 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
