name: Build & Deploy PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Installer les dépendances
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Construire la PWA
        run: npm run build

      - name: Vérifier la version construite
        run: |
          test -f dist/index.html
          test -f dist/version.json
          echo "Version prête au déploiement :"
          cat dist/version.json

      - name: Publier le build comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: choeur-lumina-pwa
          path: dist/

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORALE_LUMINA_APP }}"
          channelId: live
          projectId: chorale-lumina-app

      - name: Nettoyer l'historique des workflows
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[].id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$KEEP_RUN" ] && continue
            echo "Suppression du run $run_id"
            gh api --method DELETE "/repos/$REPO/actions/runs/$run_id"
          done
