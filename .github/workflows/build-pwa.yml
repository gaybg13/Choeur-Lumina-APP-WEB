name: Build & Deploy PWA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Installer les dépendances
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Construire la PWA
        run: npm run build

      - name: Vérifier le build
        run: |
          test -f dist/index.html
          test -f dist/version.json
          echo "Version construite :"
          cat dist/version.json

      - name: Publier le build comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: choeur-lumina-pwa
          path: dist/

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORALE_LUMINA_APP }}"
          channelId: live
          projectId: chorale-lumina-app
          target: pwa
