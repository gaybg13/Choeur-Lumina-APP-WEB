name: Build & Deploy PWA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Reconstruire la vraie vidéo d'introduction Lumina
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat intro-video/chunk_*.b64 | base64 --decode > public/lumina-intro.mp4
          test "$(wc -c < public/lumina-intro.mp4)" -eq 735687
          echo "de4ec78edd6d5837256c49953583eaaa5c255fb51e9eb48f35884deb39d07479  public/lumina-intro.mp4" | sha256sum -c -
          echo "Vidéo Lumina reconstruite :"
          ls -lh public/lumina-intro.mp4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Installer les dépendances
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Construire la PWA
        run: npm run build

      - name: Vérifier la version construite
        run: |
          test -f dist/index.html
          test -f dist/version.json
          echo "Version prête au déploiement :"
          cat dist/version.json

      - name: Publier le build comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: choeur-lumina-pwa
          path: dist/

      - name: Déployer sur Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORALE_LUMINA_APP }}"
          channelId: live
          projectId: chorale-lumina-app
