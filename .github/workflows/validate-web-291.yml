name: Validate Web 2.9.1

on:
  push:
    branches: [ chatgpt-web-2.9.1-ui-fixes ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
